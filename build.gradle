plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

// Universal 1.21.x jar: compiled against the lowest supported MC (1.21.1).
// When testing another MC via -Pminecraft_version=X without an explicit
// -Pfabric_version=Y, pick a known-good Fabric API for that MC automatically.
def defaultFabricFor = [
    '1.21'   : '0.104.0+1.21.1',
    '1.21.1' : '0.104.0+1.21.1',
    '1.21.2' : '0.104.0+1.21.2',
    '1.21.3' : '0.114.0+1.21.3',
    '1.21.4' : '0.114.0+1.21.4',
    '1.21.5' : '0.119.2+1.21.5',
    '1.21.6' : '0.127.0+1.21.6',
    '1.21.7' : '0.128.1+1.21.7',
    '1.21.8' : '0.133.3+1.21.8',
    '1.21.9' : '0.133.4+1.21.9',
    '1.21.10': '0.136.0+1.21.10',
    '1.21.11': '0.138.0+1.21.11'
]
def resolvedFabric = project.hasProperty('fabric_version_override') \
    ? project.property('fabric_version_override') \
    : (defaultFabricFor[project.minecraft_version] ?: project.fabric_version)
// Log the resolution so `./gradlew build -Pminecraft_version=1.21.9` is self-explanatory.
logger.lifecycle("GoodOptimizations: MC ${project.minecraft_version} -> Fabric API ${resolvedFabric}")

dependencies {
    // Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${resolvedFabric}"

    // MixinExtras — bundled inside our jar
    implementation annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")
    include "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
