# Minecraft / Fabric versions
#
# UNIVERSAL-JAR STRATEGY: this project compiles once against the LOWEST
# supported version (1.21.1) and the resulting jar runs on every
# 1.21.x (1.21, 1.21.1 .. 1.21.11). All version-volatile calls go through
# reflection/soft mixins (see VersionedRenderAccessor, KeyCompat), and
# fabric.mod.json declares "minecraft": ">=1.21 <1.22".
#
# To compile-test against a NEWER version (optional sanity check), run:
#   ./gradlew build -Pminecraft_version=1.21.4
# (Fabric API is picked automatically; override with
#  -Pfabric_version_override=... if needed.)
# Known-good Fabric API versions per Minecraft (from maven.fabricmc.net):
#   1.21 / 1.21.1 -> 0.104.0+1.21.1
#   1.21.2        -> 0.104.0+1.21.2
#   1.21.3        -> 0.114.0+1.21.3
#   1.21.4        -> 0.114.0+1.21.4
#   1.21.5        -> 0.119.2+1.21.5
#   1.21.6        -> 0.127.0+1.21.6
#   1.21.7        -> 0.128.1+1.21.7
#   1.21.8        -> 0.133.3+1.21.8
#   1.21.9        -> 0.133.4+1.21.9
#   1.21.10       -> 0.136.0+1.21.10
#   1.21.11       -> 0.138.0+1.21.11
minecraft_version=1.21.1
loader_version=0.15.11
fabric_version=0.104.0+1.21.1

# Mod metadata
mod_id=goodopti
mod_version=1.0.0
mod_name=GoodOptimizations
maven_group=dev.uhcm
archives_base_name=GoodOptimizations

# MixinExtras
mixinextras_version=0.3.5

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
